name: Unit tests

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.1
      
      - name: Run lint
        run: sh scripts/lint.sh

      - name: Run unit tests
        run: go test -v ./...